[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gabay-pricing-core"
version = "0.1.0"
description = "Deterministic evidence and pricing core for the project pricing workspace"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110,<1",
  "sqlalchemy>=2.0,<3",
  "pydantic>=2.0,<3",
  "uvicorn>=0.30,<1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
